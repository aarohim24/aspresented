name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor: the project runs on a stock macOS toolchain.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        # ResourceWarning is promoted to an error: a leaked file handle in a
        # project whose evidence lives in append-only logs is a real defect.
        run: python -m unittest discover -s tests -t . -v

      - name: Fail on unraised warnings
        run: python -W error::ResourceWarning -m unittest discover -s tests -t .

      - name: Regenerate the coverage table
        # The README table is generated, not typed. If this drifts, the docs lie.
        run: python tools/gen_coverage.py

      - name: Adversarial harness must pass its integrity preflight
        run: python tools/run_harness.py

      - name: An AI buyer must be able to shop through the gate
        # The other half of the question the attackers ask. A guardrail that
        # stops fraud and also stops legitimate purchases is not a guardrail,
        # it is an outage -- and this exits non-zero if an injected charge ever
        # settles beyond the signed intent.
        run: python tools/run_buyer.py

      - name: Recorded model run must still reproduce
        # The README publishes figures from a live model run. A model run has no
        # seed, so the committed transcript is the only thing that makes them
        # checkable -- replaying it here means the documented result cannot
        # drift from the code silently.
        run: python tools/run_attack.py --attacker replay --budget 40

      - name: Adversarial sweep must find no invariant violation
        # Exits non-zero when the oracle finds the gate allowed an invariant to
        # be broken. A regression that lets value escape fails the build.
        run: python tools/run_attack.py
